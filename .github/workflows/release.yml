name: Build installer

# Changing the VERSION file on main (say to 2026.11.13) runs the tests, builds
# ShootClipper-Setup-2026.11.13.exe, checks it on a real Windows machine, and publishes
# it as release v2026.11.13. The installed app looks at the latest release when it
# opens and offers the update.
#
# Nothing is published unless the tests and the packaged app's self-test both pass.
# Pushing a branch named ci/anything (see ci.yml), or "Run workflow" on the Actions tab,
# does the whole thing as a dry run without publishing.
#
# Dependencies: requirements.lock pins the exact package versions that last passed, so a
# library releasing a breaking change can't slip into a build on its own. The lock is
# rebuilt (and committed by this workflow) only when requirements.txt changes. yt-dlp is
# the exception: it is always the newest, because YouTube support goes stale quickly.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Set version
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $release = ($env:GITHUB_EVENT_NAME -eq "push") -and ($env:GITHUB_REF -eq "refs/heads/main")
          if (-not $release) { $v = "$v-test" }
          Set-Content -Path VERSION -Value $v -NoNewline
          "SC_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SC_RELEASE=$($release.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version $v (release: $release)"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          $want = (Get-FileHash requirements.txt -Algorithm SHA256).Hash
          $have = ""
          if (Test-Path requirements.lock) { $have = ((Get-Content requirements.lock -First 1) -replace "^# requirements.txt sha256: ", "").Trim() }
          if ($want -eq $have) {
            Write-Host "Installing the locked versions"
            python -m pip install -r requirements.lock
            "SC_FRESH_DEPS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "requirements.txt changed (or no lock yet): resolving fresh versions"
            python -m pip install -r requirements.txt -r requirements-dev.txt
            "SC_FRESH_DEPS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          python -m pip install --upgrade yt-dlp
          "SC_DEPS_HASH=$want" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Add ffmpeg
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          try {
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          } catch {
            Write-Host "gyan.dev failed, using BtbN build"
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dest = "$env:RUNNER_TEMP\ffmpeg-bin"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination $dest
          & "$dest\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          $dest | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Run tests
        run: |
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Build app
        run: pyinstaller packaging/ShootClipper.spec --noconfirm

      - name: Put ffmpeg in the app
        run: |
          $dest = "dist\ShootClipper\ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:RUNNER_TEMP\ffmpeg-bin\*.exe" -Destination $dest

      - name: Self-test the build
        run: |
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "dist\ShootClipper\ShootClipper.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No report written" }
          if ($p.ExitCode -ne 0) {
            # Annotations are readable without signing in, unlike the full log.
            if (Test-Path $report) {
              $text = (Get-Content $report | Select-Object -Last 40) -join "%0A"
              Write-Host "::error title=Self-test failed::$text"
            }
            throw "Self-test failed (exit $($p.ExitCode))"
          }

      - name: Lock the versions that passed
        if: env.SC_FRESH_DEPS == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          $lines = @("# requirements.txt sha256: $env:SC_DEPS_HASH", "# Written by the release workflow after the tests and self-test passed. Don't edit by hand:", "# change requirements.txt and the next build rewrites this file.")
          $lines += (python -m pip freeze --exclude yt-dlp)
          Set-Content -Path requirements.lock -Value $lines
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "Lock dependency versions that passed the build"
          git push origin HEAD:main

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:SC_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\*.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: ShootClipper-Setup-${{ env.SC_VERSION }}
          path: dist/ShootClipper-Setup-*.exe
          retention-days: 14

      - name: Publish release
        if: env.SC_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SC_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/ShootClipper-Setup-*.exe
          body_path: packaging/release-notes.md
          name: Shoot Clipper ${{ env.SC_VERSION }}
